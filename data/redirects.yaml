# Old-to-new addresses inside library.unamente.org, written by the build into _redirects (301).
# Entry addresses keep the same path (/library/<slug>/), so they need no line here.
# Forwarding from www.unamente.org/library/... to library.unamente.org is set up on the Squarespace
# side at go-live; the list for that is in docs/squarespace-url-mappings.txt.
- from: /library
  to: /
- from: /library/
  to: /
- from: /library/tag/*
  to: /
- from: /library/category/*
  to: /
