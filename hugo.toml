# UnaMente Library — site configuration
# Placeholder address until the real one is decided (see README).
baseURL = "https://library.unamente.org/"   # Daniela, 17 November 2026
title = "UnaMente Library"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
# Lane, category and trust are filters on the list, not separate pages (for now).
disableKinds = ["taxonomy", "term"]

# Search engines must not index the test build.
[params]
  visitNotice = true   # the "We count visits" notice (Daniela's yes to Google Analytics, 23 November 2026)
  analyticsID = "G-TFJ8G2FMVF"     # set to "G-TFJ8G2FMVF" only after the privacy page's with-tag library section is live (Verus, handoff 2026-11-23_0907)
  testBuild = false   # switched off for go-live, 22 November 2026 (Daniela's go-ahead, 09:59). Set back to true to undo.
  # The rest of the site stays on Squarespace; links to it from the library use this address.
  mainSite = "https://www.unamente.org"
  # Entries always shown first in the library list, by id, in this order (Daniela, 17 November 2026).
  pinFirst = ["fog-nets-drinking-water-from-mist"]
  defaultLang = "en"
  tagline = "Minds everywhere, solutions for everyone"

[taxonomies]
  lane = "lanes"
  category = "categories"
  trust = "trust"

[languages]
  [languages.en]
    label = "English"
    locale = "en"
    weight = 1
  # Castellano (Daniela's "start now", 27 November 2026): pages are machine-translated and labeled until she reads them.
  [languages.es]
    title = "Biblioteca UnaMente"
    label = "Español"
    locale = "es"
    weight = 2
  # Further languages are added here, one block each.
  # Right-to-left languages add: direction = "rtl"

[markup.goldmark.renderer]
  unsafe = false

# Cloudflare Pages reads a plain-text _redirects file from the site root.
# It is generated from data/redirects.yaml (design B1).
[mediaTypes."text/redirects"]
  delimiter = ""

[outputFormats.redirects]
  mediaType = "text/redirects"
  baseName = "_redirects"
  isPlainText = true
  notAlternative = true

# The whole library as one data file, so anyone can take every entry out in a usable form (design 012 point 6;
# Verus's question, 23 November 2026, handoff 1329). Served at /library.json.
[outputFormats.libraryjson]
  mediaType = "application/json"
  baseName = "library"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "redirects", "libraryjson"]

# Keep the full-size originals in the repository but publish only the web-sized copies.
[[cascade]]
  [cascade.build]
    publishResources = false
  [cascade.target]
    path = "{/entries/**,/library/**}"

# The build may read Cloudflare's branch name, so the Google tag goes only on the live library (main), never on the preview (scaffold). 23 November 2026.
[security.funcs]
  getenv = ['^HUGO_', '^CI$', '^CF_PAGES_BRANCH$']
