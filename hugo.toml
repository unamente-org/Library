# UnaMente Library — site configuration
# Placeholder address until the real one is decided (see README).
baseURL = "https://example.invalid/"
title = "UnaMente Library"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
# Lane, category and trust are filters on the list, not separate pages (for now).
disableKinds = ["taxonomy", "term"]

# Search engines must not index the test build.
[params]
  testBuild = true
  defaultLang = "en"
  tagline = "Minds everywhere, solutions for everyone"

[taxonomies]
  lane = "lanes"
  category = "categories"
  trust = "trust"

[languages]
  [languages.en]
    label = "English"
    locale = "en"
    weight = 1
  # Further languages are added here, one block each, for example:
  # [languages.es]
  #   label = "Español"
  #   locale = "es"
  #   weight = 2
  # Right-to-left languages add: direction = "rtl"

[markup.goldmark.renderer]
  unsafe = false
