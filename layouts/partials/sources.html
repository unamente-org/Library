{{ with .Params.sources }}
<section class="sources">
  <h2>{{ T "sources" }}</h2>
  <ol>
    {{ range . }}
    <li>
      {{ if .url }}<a href="{{ .url }}" rel="noopener">{{ .label }}</a>{{ else }}{{ .label }}{{ end }}
      {{ with .archive }} · <a href="{{ . }}" rel="noopener">{{ T "archived_copy" }}</a>{{ end }}
      {{ with .language }} · <span class="lang">{{ . }}</span>{{ end }}
      {{ with .note }}<span class="note"> — {{ . }}</span>{{ end }}
    </li>
    {{ end }}
  </ol>
</section>
{{ end }}
